    <rect x="-5" y="7" width="10" height="16" rx="2" fill="#78350f"/>
    <circle cx="3" cy="16" r="1.5" fill="#fcd34d"/>
    <!-- 门横条 -->
    <line x1="-3" y1="12" x2="5" y2="12" stroke="#92400e" stroke-width="1"/>
    <line x1="-3" y1="18" x2="5" y2="18" stroke="#92400e" stroke-width="1"/>
