  </defs>
  <rect width="100" height="100" rx="24" fill="#faf5ff"/>
  <rect x="18" y="18" width="64" height="64" rx="18" fill="url(#bg6)" stroke="#fcd34d" stroke-width="2"/>
  <!-- 粮仓 -->
  <g transform="translate(50,50)">
