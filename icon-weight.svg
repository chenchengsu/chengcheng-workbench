    <!-- 右盘 -->
    <path d="M12 -6 Q16 4 20 -6 Z" fill="#fbbf24" stroke="#d97706" stroke-width="1.5"/>
    <!-- 吊线 -->
    <line x1="-16" y1="-10" x2="-16" y2="-6" stroke="#d97706" stroke-width="1.2"/>
    <line x1="16" y1="-10" x2="16" y2="-6" stroke="#d97706" stroke-width="1.2"/>
    <!-- 顶珠 -->
    <circle cx="0" cy="-15" r="3" fill="#f59e0b" stroke="#d97706" stroke-width="1.2"/>
