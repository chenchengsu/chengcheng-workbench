<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="g-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dc2626"/>
      <stop offset="1" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4a574"/>
      <stop offset="1" stop-color="#a67c52"/>
    </linearGradient>
  </defs>
  <!-- 背景圆角 -->
  <rect width="100" height="100" rx="22" fill="url(#g-bg)"/>
  <!-- 屋顶 -->
  <path d="M14 48 L50 18 L86 48 Z" fill="url(#roof)"/>
  <!-- 屋顶纹理 -->
  <path d="M20 44 L50 22 L80 44" stroke="#7f1d1d" stroke-width="1.5" fill="none" opacity="0.3"/>
  <!-- 仓体 -->
  <rect x="22" y="46" width="56" height="38" rx="3" fill="url(#body)"/>
  <!-- 门 -->
  <rect x="40" y="58" width="20" height="26" rx="2" fill="#78350f"/>
  <circle cx="57" cy="71" r="1.8" fill="#fcd34d"/>
  <!-- 仓门横条 -->
  <line x1="42" y1="66" x2="58" y2="66" stroke="#92400e" stroke-width="1.2"/>
  <line x1="42" y1="74" x2="58" y2="74" stroke="#92400e" stroke-width="1.2"/>
  <!-- 麦穗装饰（左） -->
  <g transform="translate(28,52)">
    <line x1="0" y1="12" x2="0" y2="-6" stroke="#fef08a" stroke-width="1.5" stroke-linecap="round"/>
    <ellipse cx="-3" cy="-8" rx="3" ry="1.5" fill="#fde047" transform="rotate(-30 -3 -8)"/>
    <ellipse cx="3" cy="-8" rx="3" ry="1.5" fill="#fde047" transform="rotate(30 3 -8)"/>
    <ellipse cx="-2" cy="-11" rx="2.5" ry="1.2" fill="#facc15" transform="rotate(-25 -2 -11)"/>
    <ellipse cx="2" cy="-11" rx="2.5" ry="1.2" fill="#facc15" transform="rotate(25 2 -11)"/>
  </g>
  <!-- 麦穗装饰（右） -->
  <g transform="translate(72,52)">
    <line x1="0" y1="12" x2="0" y2="-6" stroke="#fef08a" stroke-width="1.5" stroke-linecap="round"/>
    <ellipse cx="-3" cy="-8" rx="3" ry="1.5" fill="#fde047" transform="rotate(30 -3 -8)"/>
    <ellipse cx="3" cy="-8" rx="3" ry="1.5" fill="#fde047" transform="rotate(-30 3 -8)"/>
    <ellipse cx="-2" cy="-11" rx="2.5" ry="1.2" fill="#facc15" transform="rotate(25 -2 -11)"/>
    <ellipse cx="2" cy="-11" rx="2.5" ry="1.2" fill="#facc15" transform="rotate(-25 2 -11)"/>
  </g>
</svg>
